<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亚马逊销售经营看板</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#23344b;font:14px 'Microsoft YaHei',sans-serif}aside{position:fixed;width:218px;height:100vh;background:#132c48;color:white;padding:28px 18px}h2{font-size:21px}aside small{color:#9db0c8}nav button{display:block;border:0;background:none;color:#bccbdb;padding:15px;width:100%;text-align:left;margin-top:8px;border-radius:8px;cursor:pointer}nav button.active{background:#294765;color:#ffae42}main{margin-left:218px;padding:26px 34px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#fff0d9;color:#a95a00;padding:8px 12px;border-radius:20px}.filters,.panel{background:white;border:1px solid #e2e8ef;border-radius:12px;padding:22px;margin:18px 0}select,input,button{font:inherit;padding:9px;border:1px solid #d8e0e9;border-radius:6px;background:white;color:#23344b}button{cursor:pointer}button.primary{background:#f69b25;border:0;color:#172d47}.filters{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid #e2e8ef;border-radius:10px;padding:18px}.card strong{display:block;font-size:25px;margin:12px 0}.muted{color:#8190a2;font-size:12px}.split{display:grid;grid-template-columns:2fr 1fr;gap:18px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}td,th{text-align:left;padding:14px 12px;border-bottom:1px solid #eaf0f5}th{background:#f7f9fc;color:#718198}.scroll{overflow:auto}.red{color:#cc4b42}.green{color:#238b74}.bar{height:10px;background:#e9eff5;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#eea039}h3{margin:0 0 18px}svg{width:100%;height:210px}.note{padding:14px;background:#eef4fb;border-radius:8px;line-height:1.8}label{display:inline-flex;gap:8px;align-items:center;margin:5px}input[type=number]{width:90px}@media(max-width:900px){aside{width:160px}main{margin-left:160px;padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.split{display:block}}</style><aside><h2>▦ AMAZON<br>经营驾驶舱</h2><small>团队销售分析 · DEMO V1</small><nav id="nav"></nav><div style="position:absolute;bottom:30px;color:#9db0c8">● 演示环境<br><br>数据截止 2026.11.10</div></aside><main><div class="top"><div><small class="muted">团队经营 / <span id="crumb"></span></small><h2 id="title"></h2></div><span class="badge">● 全部为虚构模拟数据</span></div><div class="filters"><label>时间 <select id="days"><option value="7">最近7天</option><option value="30" selected>最近30天</option><option value="10">本月累计</option></select></label><label>国家 <select id="country"><option>全部国家</option><option>美国</option><option>德国</option><option>英国</option></select></label><label>店铺 <select id="shop"></select></label><label>品类 <select id="cat"><option>全部品类</option><option>户外花园</option><option>家居家具</option></select></label><label>查看身份 <select id="role"><option>总监</option><option>副总监</option><option>店长</option></select></label></div><div id="content"></div><p class="muted">演示口径：统一折算 USD；推广占比 = 广告花费 / 净销售额；ACOS = 花费 / 广告归因销售额。访客为设备访次加总，非跨设备去重人数。广告统一模拟7日归因。</p></main><script>
const pages=['业绩总览','业绩详情','广告构成','单品明细','AI基础分析','数据源设置','权限设置'];let page=0,dim='国家',level=1;const $=id=>document.getElementById(id);let cfg=JSON.parse(localStorage.getItem('amz-threshold')||'null')||{达成率:90,ACOS:30,退款率:5,CTR:0.3,CPC:2,推广占比:18,净销售额:500,销量:5,访客:50,展现:1000,花费:300,点击:10};const products=['庭院遮阳伞','金属储物棚','户外棚架','休闲藤椅','餐桌组合','折叠边桌'];let rows=[];for(let d=0;d<30;d++)for(let i=0;i<18;i++){let j=i%6,n=12+((i*17+d*13)%39),s=n*(32+j*18),sp=s*(.08+(i%5)*.035),cl=Math.round(sp/(.7+(i%4)*.4));rows.push({d,country:['美国','德国','英国'][i%3],shop:['北美旗舰店','欧洲生活馆','英国家居店'][i%3],c1:j<3?'户外花园':'家居家具',c2:j<3?'庭院设施':'休闲家具',c3:products[j],sku:'DEMO-'+String(i+1).padStart(3,'0'),asin:'B0DEMO'+String(i+1).padStart(4,'0'),s,n,sp,cl,im:cl*(100+i*20),ad:s*(.3+(i%4)*.08),ord:Math.round(cl*.08),pc:n*4,mo:n*9,refund:Math.round(n*(i%4)*.024),target:s*(.85+(i%5)*.12)} )}
function sum(a){return a.reduce((o,r)=>{for(let k of ['s','n','sp','cl','im','ad','ord','pc','mo','refund','target'])o[k]=(o[k]||0)+r[k];return o},{})}function metrics(r){return {'净销售额':r.s,'销量':r.n,'推广占比':r.sp/r.s*100,'退款率':r.refund/r.n*100,'电脑端访客':r.pc,'手机端访客':r.mo,'访客总计':r.pc+r.mo,'广告展现':r.im,'点击':r.cl,'花费':r.sp,CTR:r.cl/r.im*100,CVR:r.ord/r.cl*100,CPC:r.sp/r.cl,ACOS:r.sp/r.ad*100,'达成率':r.s/r.target*100}}const pct=['推广占比','退款率','CTR','CVR','ACOS','达成率'];function fmt(k,v){if(!Number.isFinite(v))return '—';return (['净销售额','花费','CPC','目标'].includes(k)?'$':'')+v.toLocaleString('en-US',{maximumFractionDigits:pct.includes(k)||k==='CPC'?2:0})+(pct.includes(k)?'%':'')}function data(){return rows.filter(r=>r.d<+$('days').value&&($('country').value==='全部国家'||r.country===$('country').value)&&($('shop').value==='全部店铺'||r.shop===$('shop').value)&&($('cat').value==='全部品类'||r.c1===$('cat').value))}function groups(a,key){return Object.entries(Object.groupBy(a,r=>r[key])).map(([name,x])=>({name,...sum(x),raw:x}))}function flags(r){let m=metrics(r);return Object.entries(cfg).filter(([k,v])=>{let z=k==='访客'?m['访客总计']:k==='展现'?m['广告展现']:m[k];return ['ACOS','退款率','CPC','推广占比','花费'].includes(k)?z>v:z<v}).map(([k])=>k)}function table(a,keys,detail=false){return '<div class="scroll"><table><thead><tr><th>维度 / 产品</th>'+keys.map(k=>'<th>'+k+'</th>').join('')+(detail?'<th>异常判断</th>':'')+'</tr></thead><tbody>'+a.map(r=>'<tr><td><b>'+r.name+'</b>'+(r.raw&&detail?'<br><small class="muted">'+r.raw[0].asin+' · '+r.raw[0].shop+'</small>':'')+'</td>'+keys.map(k=>'<td>'+fmt(k,k==='目标'?r.target:metrics(r)[k])+'</td>').join('')+(detail?'<td class="red">'+(flags(r).join('、')||'<span class="green">正常</span>')+'</td>':'')+'</tr>').join('')+'</tbody></table></div>'}function render(){let a=data(),t=sum(a),m=metrics(t);$('title').textContent=pages[page];$('crumb').textContent=pages[page];$('nav').innerHTML=pages.map((p,i)=>'<button class="'+(page===i?'active':'')+'" onclick="page='+i+';render()">0'+(i+1)+'　'+p+'</button>').join('');let h='';if(!a.length&&page<5){$('content').innerHTML='<div class="panel">当前筛选无数据，请调整国家或店铺。</div>';return}
if(page===0){h='<div class="cards">'+Object.entries(m).filter(([k])=>k!=='达成率').map(([k,v])=>'<div class="card"><span class="muted">'+k+'</span><strong>'+fmt(k,v)+'</strong><small class="muted">所选期间 · 模拟数据</small></div>').join('')+'</div><div class="split"><div class="panel"><h3>净销售额趋势</h3><svg viewBox="0 0 700 210"><path d="M0 180H700 M0 110H700 M0 40H700" stroke="#e6edf4"/><polyline fill="none" stroke="#357db1" stroke-width="4" points="'+Array.from({length:+$('days').value},(_,d)=>{let v=sum(a.filter(r=>r.d===d)).s;return (d*700/(+$('days').value-1))+','+(190-v/Math.max(...Array.from({length:+$('days').value},(_,x)=>sum(a.filter(r=>r.d===x)).s))*160)}).join(' ')+'"/></svg><span class="muted">从最近一天到所选期初 · 日销售额</span></div><div class="panel"><h3>经营目标进度</h3><h1>'+fmt('达成率',m.达成率)+'</h1><div class="bar"><i style="width:'+Math.min(m.达成率,100)+'%"></i></div><p>期间目标 '+fmt('目标',t.target)+'</p><button class="primary" onclick="page=4;render()">查看异常诊断 →</button></div></div>'}
if(page===1)h='<div class="panel"><div class="filters">'+['国家','店铺','品类'].map(x=>'<button onclick="dim=\''+x+'\';render()">'+x+(dim===x?' ✓':'')+'</button>').join('')+'<label>分类层级 <select onchange="level=+this.value;render()">'+[1,2,3].map(x=>'<option '+(level===x?'selected':'')+' value="'+x+'">'+x+'级分类</option>').join('')+'</select></label></div>'+table(groups(a,dim==='国家'?'country':dim==='店铺'?'shop':'c'+level),['净销售额','销量','访客总计','花费','广告展现','点击','CTR','CVR','CPC','ACOS','目标','达成率'])+'</div>';
if(page===2)h='<div class="panel"><h3>广告投入结构</h3><p class="muted">按统一模拟比例拆分，同一筛选下花费合计与总览一致。</p>'+['SP','SB','SD','SBV'].map((x,i)=>{let p=[.58,.18,.14,.1][i];return '<div style="padding:20px"><b>'+x+'</b><span style="float:right">'+fmt('花费',t.sp*p)+'　'+p*100+'%</span><p class="bar"><i style="width:'+p*100+'%;background:'+['#2c668f','#ed9d35','#5aa8af','#8f9bb2'][i]+'"></i></p></div>'}).join('')+'</div>';
if(page===3)h='<div class="panel"><h3>SKU / ASIN 异常监控</h3><label>搜索 <input id="search" placeholder="SKU 或 ASIN" oninput="filterProducts(this.value)"></label><div id="products">'+table(groups(a,'sku'),['净销售额','销量','访客总计','退款率','推广占比','广告展现','点击','花费','CTR','CVR','CPC','ACOS','目标','达成率'],true)+'</div></div>';
if(page===4){let g=groups(a,'sku'),bad=g.filter(r=>flags(r).length);h='<div class="panel"><h3>诊断标准 · 可配置</h3><p class="muted">最低值：达成率、销售额、销量、访客、展现、点击、CTR；其余为最高值。金额单位 USD，比例单位 %，均对所选期间累计值判断。</p>'+Object.entries(cfg).map(([k,v])=>'<label>'+k+' <input type="number" min="0" step="0.1" value="'+v+'" onchange="cfg[\''+k+'\']=+this.value"></label>').join('')+'<p><button class="primary" onclick="localStorage.setItem(\'amz-threshold\',JSON.stringify(cfg));render()">应用标准并生成诊断</button></p></div><div class="panel"><h3>基础诊断摘要</h3><div class="note">发现 '+bad.length+' / '+g.length+' 个产品触发规则。此摘要由本地规则生成，可能原因需人工核实。</div>'+groups(a,'c'+level).map(r=>'<p><b>'+r.name+'</b>：'+(flags(r).join('、')||'全部达标')+'</p>').join('')+bad.map(r=>'<div class="panel"><b>'+r.name+' · '+r.raw[0].c3+'</b><p class="red">触发：'+flags(r).join('、')+'</p><p>期间净销售额 '+fmt('净销售额',r.s)+'，目标达成 '+fmt('达成率',metrics(r).达成率)+'，ACOS '+fmt('ACOS',metrics(r).ACOS)+'。</p><p>建议：核对预算和搜索词质量；检查价格、评价与商品页面转化。先核实数据与归因，再调整投放。</p></div>').join('')+'</div><div class="panel">报告更新：每周一 09:00（北京时间，演示设置；无后台任务）<br><small class="muted">当前报告随筛选和阈值即时重算，不调用外部 AI。</small></div>'}
if(page===5)h='<div class="panel"><h3>数据源设置</h3><div class="note">当前仅使用内置虚构数据，不连接真实亚马逊账户，不收集密钥。</div>'+['销售与退款报表','访客与流量报表','广告报表','经营目标'].map(x=>'<div class="panel"><b>'+x+'</b><span class="green" style="float:right">内置模拟数据 · 已就绪</span></div>').join('')+'<label>展示更新频率 <select id="freq"><option>每日</option><option>每周</option></select></label><button onclick="localStorage.setItem(\'demo-frequency\',$(\'freq\').value);alert(\'演示设置已保存；不会触发数据同步\')">保存演示设置</button></div>';
if(page===6)h='<div class="panel"><h3>权限设置 · 角色预览</h3><div class="note">身份切换仅为原型演示，不构成真实身份认证或访问控制。店长固定查看北美旗舰店，副总监查看美国业务，总监查看全部。</div><table><tr><th>角色</th><th>数据范围</th><th>能力预览</th></tr><tr><td>总监</td><td>全部国家与店铺</td><td>经营查看、规则配置</td></tr><tr><td>副总监</td><td>美国业务</td><td>所辖业务分析</td></tr><tr><td>店长</td><td>北美旗舰店</td><td>单品异常查看</td></tr></table></div>';
$('content').innerHTML=h;if(page===5&&localStorage.getItem('demo-frequency'))$('freq').value=localStorage.getItem('demo-frequency')}
function filterProducts(q){$('products').innerHTML=table(groups(data(),'sku').filter(r=>(r.name+r.raw[0].asin).toLowerCase().includes(q.toLowerCase())),['净销售额','销量','访客总计','退款率','推广占比','广告展现','点击','花费','CTR','CVR','CPC','ACOS','目标','达成率'],true)}$('shop').innerHTML=['全部店铺','北美旗舰店','欧洲生活馆','英国家居店'].map(x=>'<option>'+x+'</option>').join('');for(let id of ['days','country','shop','cat'])$(id).onchange=render;$('role').onchange=()=>{let r=$('role').value;$('country').value=r==='总监'?'全部国家':'美国';$('shop').value=r==='店长'?'北美旗舰店':'全部店铺';$('country').disabled=r!=='总监';$('shop').disabled=r==='店长';render()};render();
</script></html>
